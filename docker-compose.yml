services:
  test_db:
    image: postgres:16
    container_name: dormify_test_db
    restart: always
    profiles:
      - local-db
    environment:
      POSTGRES_DB: dormify_test
      POSTGRES_USER: ${TEST_DB_USER:-dormify_user}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-dormify_password}
    ports:
      # G3-20: localhost-only, not 0.0.0.0 - this is a disposable local
      # test database (never real data), but there's no reason to expose
      # it on every network interface. Same-machine connections
      # (ENV_FILE=.env.test -> DB_HOST=localhost) are unaffected either
      # way. TEST_DB_USER/TEST_DB_PASSWORD may be overridden via an
      # untracked .env for local hygiene; the defaults keep `docker-compose
      # up` working out of the box with no setup required.
      - "127.0.0.1:5433:5432"
    volumes:
      - dormify_test_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: dormify_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      # G3-13: Django's DEBUG now defaults to False when the variable is
      # absent (secure by default). This container never sees the
      # repo-root .env at all (only ./backend is mounted, not the repo
      # root - see settings.py's ENV_FILE/load_dotenv() call, which finds
      # nothing to load in here), so DEBUG must be supplied explicitly
      # right here for local Docker development to keep behaving like
      # development. SECRET_KEY is deliberately left unset - DEBUG=True
      # makes settings.py fall back to a fixed, clearly-labeled
      # development-only key (see settings.py), which is fine for a
      # throwaway local container and keeps one fewer thing to configure.
      DEBUG: "True"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dormify_frontend
    restart: always
    command: npm start
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  dormify_test_pgdata: