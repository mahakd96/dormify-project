services:
  db:
    image: postgres:15
    container_name: dormify_db
    restart: always
    environment:
      POSTGRES_DB: dormify
      POSTGRES_USER: dormify_user
      POSTGRES_PASSWORD: dormify_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: dormify_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: dormify
      DB_USER: dormify_user
      DB_PASSWORD: dormify_pass
      DB_HOST: db
      DB_PORT: 5432

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dormify_frontend
    restart: always
    command: npm start
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres_data: