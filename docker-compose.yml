services:
  test_db:
    image: postgres:16
    container_name: dormify_test_db
    restart: always
    profiles:
      - local-db
    environment:
      POSTGRES_DB: dormify_test
      POSTGRES_USER: dormify_user
      POSTGRES_PASSWORD: dormify_password
    ports:
      - "5433:5432"
    volumes:
      - dormify_test_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: dormify_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dormify_frontend
    restart: always
    command: npm start
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  dormify_test_pgdata: